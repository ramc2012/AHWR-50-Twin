server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Re-resolve the backend hostname via Docker's embedded DNS at request time.
    # Using a variable in proxy_pass forces nginx to honour this resolver instead of
    # caching the upstream IP at startup, so a backend container recreate self-heals
    # (no more 502s until a manual nginx restart).
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # The rig link is slow and often shared; text assets compress ~4x.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json image/svg+xml application/manifest+json;

    # Vite fingerprints these filenames, so the content at a given URL never changes.
    # Cache them hard — this is also what makes the no-store on index.html cheap.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Single-page app: hand client-side routes back to index.html.
    location / {
        try_files $uri $uri/ /index.html;

        # index.html must NEVER be cached: a stale copy references asset hashes that no
        # longer exist after a redeploy, which is exactly the chunk-load failure the
        # frontend's lazyWithRetry has to recover from. Don't create the problem.
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;

        # The console runs unattended on the rig floor. Framing it would let a page the
        # operator opens elsewhere click through to alarm acknowledgement.
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        # Self-contained SPA: no third-party origins, and nothing may frame it.
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }

    # REST API -> backend service (internal network only).
    location /api/ {
        set $backend http://backend:5000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.io live telemetry (WebSocket upgrade).
    location /socket.io/ {
        set $backend http://backend:5000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }
}
