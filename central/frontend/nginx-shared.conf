# CRMF portal — shared server body, included by BOTH the plain-HTTP (:80) block in
# conf.d/default.conf and the generated TLS (:443) block in conf.d/zz-crmf-tls.conf
# (see docker-entrypoint.d/40-crmf-tls.sh). Everything here is spliced at SERVER
# context, so every directive must be valid inside `server { }`. Keeping all the
# locations in one file is what stops HTTP and HTTPS behaviour from diverging.

# Re-resolve the backend hostname via Docker DNS at request time so a backend
# container recreate self-heals (no cached upstream IP -> no lingering 502s).
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

# The link to the monitoring centre is shared; text assets compress ~4x.
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied any;
gzip_types text/plain text/css text/javascript application/javascript
           application/json image/svg+xml application/manifest+json;

# Default request-body cap for everything EXCEPT /ingest, which raises its own.
# Matches the backend's express.json({ limit: '1mb' }).
client_max_body_size 1m;

# Vite fingerprints these filenames, so the content at a given URL never changes.
# Cache them hard — that is what makes no-store on index.html cheap.
location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

# Single-page app: hand client-side routes back to index.html.
location / {
    try_files $uri $uri/ /index.html;

    # index.html must NEVER be cached: a stale copy references asset hashes that no
    # longer exist after a redeploy.
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Pragma "no-cache" always;

    # The portal holds 8 h operator JWTs. Nothing may frame it or sniff its types.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    # Empty (header omitted) over plain HTTP, real value over TLS — see the
    # $crmf_hsts map in conf.d/default.conf.
    add_header Strict-Transport-Security $crmf_hsts always;
    # img-src carries the DEFAULT basemap tile host used by
    # frontend/src/components/FleetMap.jsx. An air-gapped ONGC deployment points
    # VITE_MAP_TILE_URL at an internal tile server and should then tighten this
    # back to "'self' data:".
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://*.basemaps.cartocdn.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
}

# --- Rig-edge store-and-forward ingestion ------------------------------------
# Once crmf-backend's own published port is loopback-only (INGEST_BIND), this is
# the ONLY route a rig has to /ingest. Mirrors the k8s Ingress, which already
# routes /ingest to crmf-backend (deploy/helm/crmf/templates/ingress.yaml).
location = /ingest {
    set $backend http://crmf-backend:6000;
    proxy_pass $backend;
    proxy_http_version 1.1;

    # Bounds the COMPRESSED batch. nginx never inflates a request body, so this is
    # a wire-size cap only; the backend separately caps the INFLATED size
    # (INGEST_MAX_BODY / INGEST_MAX_INFLATED_BYTES). A real 10 s batch is a few KB.
    client_max_body_size 8m;
    client_body_timeout 30s;
    # Buffer the whole body here before opening the upstream request, so a slow
    # uploader never holds a Node connection open.
    proxy_request_buffering on;
    proxy_read_timeout 60s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# REST API -> backend (internal network only).
location /api/ {
    set $backend http://crmf-backend:6000;
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Socket.IO live updates (WebSocket upgrade).
location /socket.io/ {
    set $backend http://crmf-backend:6000;
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 86400;
}
