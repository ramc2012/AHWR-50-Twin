# REPLACES the existing central/frontend/nginx.conf in full.
#
# CRMF fleet portal — plain-HTTP server block.
#
# The TLS (:443) block is GENERATED at container start by
# /docker-entrypoint.d/40-crmf-tls.sh, and only when a cert+key are actually
# mounted at /certs — the same conditional-TLS posture the MCP servers use
# (TLS_CERT_FILE / TLS_KEY_FILE + a read-only ./certs volume). With no certs the
# portal comes up exactly as it did before, on :80 only.
#
# Both blocks include the SAME /etc/nginx/crmf-shared.conf, so HTTP and HTTPS can
# never drift apart.

# HSTS only means anything over TLS. add_header with an empty value emits no
# header at all, so one shared location set serves both schemes.
map $scheme $crmf_hsts {
    https   "max-age=31536000; includeSubDomains";
    default "";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/crmf-shared.conf;
}
