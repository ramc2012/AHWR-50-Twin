---
# CRMF ETP v1.2 + WITSML 2.1 server (repo/central/etp-witsml): the CMF historian
# over Energistics standards. Consumers read (Discovery, Store, ChannelSubscribe,
# ChannelDataFrame) with a portal token; rig edges load their own rig (Store +
# ChannelDataLoad) with their device token. Nothing is written back to a rig/PLC.
# Build: docker build -t harbor.ongc.local/crmf/crmf-etp-witsml:1.0.0 repo/central/etp-witsml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: crmf-etp-witsml
  namespace: crmf
  labels:
    app.kubernetes.io/part-of: crmf
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/name: etp-witsml
    app.kubernetes.io/component: standards
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: crmf-etp-witsml-config
  namespace: crmf
  labels:
    app.kubernetes.io/part-of: crmf
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/name: etp-witsml
    app.kubernetes.io/component: standards
data:
  # Historian wiring (same TimescaleDB the rest of CRMF reads).
  PGHOST: "crmf-timescaledb-rw"
  PGPORT: "5432"
  PGDATABASE: "crmf"
  PGUSER: "crmf_app"         # least-privilege application role, as the backend
  HTTP_PORT: "8080"
  ETP_PORT: "8443"
  # Informational: the server implements ETP v1.2 and WITSML 2.1 (eml 2.3).
  ETP_VERSION: "1.2"
  WITSML_VERSION: "2.1"
---
apiVersion: v1
kind: Service
metadata:
  name: crmf-etp-witsml
  namespace: crmf
  labels:
    app.kubernetes.io/part-of: crmf
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/name: etp-witsml
    app.kubernetes.io/component: standards
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: etp-witsml
    app.kubernetes.io/component: standards
  ports:
    - name: http              # WITSML 2.1 objects over HTTP, health, capabilities
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: etp               # ETP v1.2 WebSocket (etp12.energistics.org) + capabilities
      port: 8443
      targetPort: 8443
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crmf-etp-witsml
  namespace: crmf
  labels:
    app.kubernetes.io/part-of: crmf
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/name: etp-witsml
    app.kubernetes.io/component: standards
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: etp-witsml
      app.kubernetes.io/component: standards
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: crmf
        app.kubernetes.io/managed-by: kubectl
        app.kubernetes.io/name: etp-witsml
        app.kubernetes.io/component: standards
    spec:
      serviceAccountName: crmf-etp-witsml
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: etp-witsml
          image: harbor.ongc.local/crmf/crmf-etp-witsml:1.0.0
          envFrom:
            - configMapRef:
                name: crmf-etp-witsml-config
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: crmf-secrets
                  key: PGPASSWORD
            - name: JWT_SECRET       # verifies portal tokens of ETP/WITSML readers
              valueFrom:
                secretKeyRef:
                  name: crmf-secrets
                  key: JWT_SECRET
          ports:
            - name: http
              containerPort: 8080
            - name: etp
              containerPort: 8443
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "768Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
